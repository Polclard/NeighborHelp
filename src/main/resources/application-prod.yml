spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Managed Postgres providers hand out a single connection string, so accept
    # either SPRING_DATASOURCE_URL / DATABASE_URL or the discrete DB_* vars.
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:neighborhelp}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    refresh-cookie:
      # The SPA is served from a different site than the API in production, so
      # the browser only returns the cookie when it is None + Secure.
      secure: ${APP_REFRESH_COOKIE_SECURE:true}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:None}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
