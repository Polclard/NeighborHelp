spring:
  application:
    name: NeighborHelp
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
  auth:
    refresh-cookie:
      secure: ${APP_REFRESH_COOKIE_SECURE:false}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Lax}
  upload:
    dir: ${APP_UPLOAD_DIR:./var/uploads}
  storage:
    # "local" writes to app.upload.dir and serves /uploads/**; "cloudinary"
    # uploads to Cloudinary and stores the delivery URL instead.
    #
    # Leave unset to auto-select: Cloudinary when its credentials are present,
    # otherwise local. Set it explicitly to override that.
    provider: ${APP_STORAGE_PROVIDER:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:neighborhelp}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:5173,http://127.0.0.1:4173,http://127.0.0.1:5173}
  websocket:
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:5173,http://127.0.0.1:4173,http://127.0.0.1:5173}
  mail:
    host: ${MAILPIT_SMTP_HOST:localhost}
    port: ${MAILPIT_SMTP_PORT:1025}
  routing:
    openrouteservice-api-key: ${OPENROUTESERVICE_API_KEY:replace-me}
