spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  upload:
    dir: ./var/uploads-test
  cors:
    allowed-origins: http://localhost:3000
  websocket:
    allowed-origins: http://localhost:3000

logging:
  level:
    root: WARN
