services:
  neighborhelp-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-neighborhelp}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${HOST_DB_PORT:-5433}:5432"
    volumes:
      - neighborhelp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-neighborhelp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  neighborhelp-mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${HOST_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${HOST_MAILPIT_UI_PORT:-8025}:8025"

  neighborhelp-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      neighborhelp-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: neighborhelp-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-neighborhelp}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      APP_UPLOAD_DIR: /var/neighborhelp/uploads
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_WEBSOCKET_ALLOWED_ORIGINS: ${APP_WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000}
      MAILPIT_SMTP_HOST: neighborhelp-mailpit
      MAILPIT_SMTP_PORT: 1025
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-replace-me}
    ports:
      - "${HOST_BACKEND_PORT:-8080}:8080"
    volumes:
      - neighborhelp_uploads:/var/neighborhelp/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/posts >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  neighborhelp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      neighborhelp-backend:
        condition: service_healthy
    ports:
      - "${HOST_FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  neighborhelp_postgres_data:
  neighborhelp_uploads:
